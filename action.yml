name: mssql suite-v2
branding:
  icon: database
  color: yellow
description: >-
  Installs a SQL Server suite of tools including sqlcmd, bcp, sqlpackage,
  db engine and localdb for Windows, macOS and Linux.
inputs:
  install:
    description: "Comma-separated list of tools to install: sqlengine, sqlclient, sqlpackage, localdb"
    default: sqlengine
  sa-password:
    description: SA password for the SQL Server instance
    default: Qwe12345
  show-log:
    description: "Show Docker/brew logs for troubleshooting (true | false)"
    default: "false"
  collation:
    description: SQL Server collation
    default: SQL_Latin1_General_CP1_CI_AS
  version:
    description: "SQL Server version to install: 2017, 2019, or 2022"
    default: "2019"
  download-path:
    description: Local path for downloaded SQL Server installer files (defaults to runner temp directory)
    default: ""
  download-only:
    description: "Download installers without installing — Windows only (true | false)"
    default: "false"
runs:
  using: composite
  steps:
    # --- Caching: SQL Server installers (Windows) ---
    - name: Cache SQL Server installers
      if: ${{ runner.os == 'Windows' && contains(inputs.install, 'sqlengine') }}
      uses: actions/cache@v4
      with:
        path: |
          ${{ inputs.download-path || runner.temp }}/sqlsetup.exe
          ${{ inputs.download-path || runner.temp }}/sqlsetup.box
          ${{ inputs.download-path || runner.temp }}/setup
          ${{ inputs.download-path || runner.temp }}/mssql-installed-${{ inputs.version }}.marker
        key: mssql-installer-${{ inputs.version }}-${{ runner.os }}-v2

    # --- Caching: Installed SQL Server instance (Windows) ---
    - name: Cache SQL Server instance
      if: ${{ runner.os == 'Windows' && contains(inputs.install, 'sqlengine') }}
      uses: actions/cache@v4
      with:
        path: |
          C:\Program Files\Microsoft SQL Server
        key: mssql-instance-${{ inputs.version }}-${{ inputs.collation }}-${{ runner.os }}-v1

    # --- Caching: sqlpackage ---
    - name: Cache sqlpackage (Windows)
      if: ${{ runner.os == 'Windows' && contains(inputs.install, 'sqlpackage') }}
      uses: actions/cache@v4
      with:
        path: C:\Program Files\sqlpackage
        key: sqlpackage-direct-${{ runner.os }}-v1

    - name: Cache sqlpackage (Linux/macOS)
      if: ${{ runner.os != 'Windows' && contains(inputs.install, 'sqlpackage') }}
      uses: actions/cache@v4
      with:
        path: ~/sqlpackage
        key: sqlpackage-${{ runner.os }}

    # --- Caching: Docker image (Linux) ---
    - name: Cache Docker image
      if: ${{ runner.os == 'Linux' && contains(inputs.install, 'sqlengine') }}
      uses: actions/cache@v4
      with:
        path: ${{ inputs.download-path || runner.temp }}/mssql-docker-${{ inputs.version }}.tar
        key: mssql-docker-${{ inputs.version }}-${{ runner.os }}-v1

    # --- Caching: Homebrew (macOS) ---
    - name: Cache Homebrew packages
      if: ${{ runner.os == 'macOS' }}
      uses: actions/cache@v4
      with:
        path: |
          ~/Library/Caches/Homebrew
          /usr/local/Cellar
        key: homebrew-mssql-${{ runner.os }}-${{ inputs.version }}
        restore-keys: |
          homebrew-mssql-${{ runner.os }}-

    # --- Main steps ---
    - name: Download Windows installers
      if: ${{ inputs.download-only == 'true' }}
      shell: pwsh
      working-directory: ${{ github.action_path }}
      env:
        MSSQL_VERSION: ${{ inputs.version }}
        MSSQL_DOWNLOAD_PATH: ${{ inputs.download-path }}
      run: |
        $path = if ($env:MSSQL_DOWNLOAD_PATH) { $env:MSSQL_DOWNLOAD_PATH } else { $env:RUNNER_TEMP }
        ./download.ps1 -Path $path -Version $env:MSSQL_VERSION

    - name: Install SQL Server tools
      if: ${{ inputs.download-only != 'true' }}
      shell: pwsh
      working-directory: ${{ github.action_path }}
      env:
        ACCEPT_EULA: "Y"
        HOMEBREW_ACCEPT_EULA: "Y"
        HOMEBREW_NO_AUTO_UPDATE: "1"
        HOMEBREW_NO_INSTALL_CLEANUP: "1"
        MSSQL_AGENT_ENABLED: "true"
        SA_PASSWORD: ${{ inputs.sa-password }}
        MSSQL_INSTALL: ${{ inputs.install }}
        MSSQL_SHOW_LOG: ${{ inputs.show-log }}
        MSSQL_COLLATION: ${{ inputs.collation }}
        MSSQL_VERSION: ${{ inputs.version }}
        MSSQL_DOWNLOAD_PATH: ${{ inputs.download-path }}
      run: ./main.ps1

