name: mssql suite-v2
branding:
  icon: database
  color: yellow
description: >-
  Installs a SQL Server suite of tools including sqlcmd, bcp, sqlpackage,
  db engine and localdb for Windows, macOS and Linux.
inputs:
  install:
    description: "Comma-separated list of tools to install: sqlengine, sqlclient, sqlpackage, localdb"
    default: sqlengine
  sa-password:
    description: SA password for the SQL Server instance
    default: Qwe12345
  show-log:
    description: "Show Docker/brew logs for troubleshooting (true | false)"
    default: "false"
  collation:
    description: SQL Server collation
    default: SQL_Latin1_General_CP1_CI_AS
  version:
    description: "SQL Server version to install: 2017, 2019, or 2022"
    default: "2019"
  download-path:
    description: Local path for downloaded SQL Server installer files (defaults to runner temp directory)
    default: ""
  download-only:
    description: "Download installers without installing — Windows only (true | false)"
    default: "false"
runs:
  using: composite
  steps:
    # --- Main steps ---
    - name: Download Windows installers
      if: ${{ inputs.download-only == 'true' }}
      shell: pwsh
      working-directory: ${{ github.action_path }}
      env:
        MSSQL_VERSION: ${{ inputs.version }}
        MSSQL_DOWNLOAD_PATH: ${{ inputs.download-path }}
      run: |
        $path = if ($env:MSSQL_DOWNLOAD_PATH) { $env:MSSQL_DOWNLOAD_PATH } else { $env:RUNNER_TEMP }
        ./download.ps1 -Path $path -Version $env:MSSQL_VERSION

    - name: Install SQL Server tools
      if: ${{ inputs.download-only != 'true' }}
      shell: pwsh
      working-directory: ${{ github.action_path }}
      env:
        ACCEPT_EULA: "Y"
        HOMEBREW_ACCEPT_EULA: "Y"
        HOMEBREW_NO_AUTO_UPDATE: "1"
        HOMEBREW_NO_INSTALL_CLEANUP: "1"
        MSSQL_AGENT_ENABLED: "true"
        SA_PASSWORD: ${{ inputs.sa-password }}
        MSSQL_INSTALL: ${{ inputs.install }}
        MSSQL_SHOW_LOG: ${{ inputs.show-log }}
        MSSQL_COLLATION: ${{ inputs.collation }}
        MSSQL_VERSION: ${{ inputs.version }}
        MSSQL_DOWNLOAD_PATH: ${{ inputs.download-path }}
      run: ./main.ps1

